name: Mundialito automatic jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: mundialito-automatic-jobs
  cancel-in-progress: false

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run Mundialito orchestrator
        run: |
          for i in 1 2 3 4 5; do
            echo "Pulse $i/5"
            curl --fail-with-body --request POST \
              --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              --header "x-vercel-cron: 1" \
              --header "Content-Type: application/json" \
              https://mundialito-mu.vercel.app/api/jobs/orchestrator
            if [ "$i" != "5" ]; then
              sleep 60
            fi
          done
