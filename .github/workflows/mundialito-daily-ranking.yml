name: Mundialito daily ranking

on:
  schedule:
    - cron: "0,15 2 * * *"
  workflow_dispatch:

concurrency:
  group: mundialito-daily-ranking
  cancel-in-progress: false

jobs:
  daily-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send daily ranking
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "x-vercel-cron: 1" \
            --header "Content-Type: application/json" \
            https://mundialito-mu.vercel.app/api/jobs/send-daily-ranking
